name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify release tag
        run: |
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$version"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: npm run verify
      - run: npm run package
      - uses: actions/upload-artifact@v6
        with:
          name: reloadstar-release
          path: dist/*
          if-no-files-found: error
      - name: Attach package to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
          fi

  chrome-web-store:
    needs: package
    if: >-
      always() && github.repository == 'lchavess1024/Reloadstar' &&
      ((github.ref_type == 'tag' && needs.package.result == 'success' && vars.CWS_PUBLISH_ENABLED == 'true') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: reloadstar-chrome-web-store
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check Store configuration
        env:
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ vars.CWS_ITEM_ID }}
          CWS_WIF_PROVIDER: ${{ vars.CWS_WIF_PROVIDER }}
          CWS_SERVICE_ACCOUNT: ${{ vars.CWS_SERVICE_ACCOUNT }}
        run: |
          if [[ -z "$CWS_PUBLISHER_ID" || -z "$CWS_ITEM_ID" || -z "$CWS_WIF_PROVIDER" || -z "$CWS_SERVICE_ACCOUNT" ]]; then
            echo '::error::Set the four Chrome Web Store variables described in docs/RELEASE.md.'
            exit 1
          fi
      - uses: actions/download-artifact@v7
        if: github.ref_type == 'tag'
        with:
          name: reloadstar-release
          path: dist
      - name: Get a short-lived Google access token
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.CWS_WIF_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
          export_environment_variables: false
      - name: Check access or submit release
        env:
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ vars.CWS_ITEM_ID }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            npm run release -- --check-auth
          else
            (cd dist && sha256sum --check *.sha256)
            npm run release
          fi
